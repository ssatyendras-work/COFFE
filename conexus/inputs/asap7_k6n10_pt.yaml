# ASAP7 K6 N10 with pass transistors: COFFE's archived 7 nm run (gate 2 of HATF-TECH-M2, ADR-0010 D8).
# input_files/finfet_7nm_example.yaml with switch_type pass_transistor, as in
# unit_tests/test_results_archive/custom_flow_results/finfet_7nm_pass_report.txt (85.58 um2, 48.98 ps, HSPICE):
# every parameter that report lists matches. rest_length_factor is not in the report; the example's 5 is kept.
fpga_arch_params:
  N: 10
  K: 6
  W: 320
  L: 4
  I: 40
  Fs: 3
  Fcin: 0.2
  Fcout: 0.025
  Or: 2
  Ofb: 1
  Fclocal: 0.5
  Rsel: c
  Rfb: c
  transistor_type: finfet
  switch_type: pass_transistor
  vdd: 0.7
  vsram: 0.9
  vsram_n: 0.0
  gate_length: 20
  rest_length_factor: 5
  min_tran_width: 27
  trans_diffusion_length: 27
  min_width_tran_area: 2165
  sram_cell_area: 4
  model_path: spice_models/7nm_TT_160803.l
  model_library: 7NM_FINFET_HP
  metal:
  - [0.1287, 0.00022]
  - [0.0216, 0.00024]
