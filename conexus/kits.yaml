# Hand-off kits for timed COFFE2 runs on ngspice (conexus/kits.py). Owner's decisions, 2026-11-05: ngspice at 5 ps and
# 20 ps maximum step against the archived HSPICE flut0 run; Hyperion (Docker, about 32 CPUs, load guard 96) and the
# Slurm cluster (udocker, settings from ChiSER's chess: module udocker 1.3.3, R1, shared container, batch_long.q,
# lvkclsclc010 excluded, ROOT on /imec/other/sdsi).
hatf_tech: ~/workspace/Co-Nexus/frameworks/HATF/HATF-TECH/hatf-tech
image:
  reference: registry.conexus.local/hatf-tech/technology:0.2.0
  archive: ~/workspace/Co-Nexus/collaterals/images/technology_0.2.0.tar
kits:
  - name: coffe-flut0-ngspice-hyperion
    where: hyperion
    engine: docker
    remote: siva@hyperion
    root: /home/siva/conexus
    runs:
      - {name: ngspice-5p, tmax: 5p}
      - {name: ngspice-20p, tmax: 20p}
    iterations: 4
    max_load: 96
    tier_a: {cpus: 4, estimate: "about 1 minute for both runs"}
    tier_b: {cpus: 16, estimate: "about 3-6 h at 5 ps and 1-2 h at 20 ps (both run at once, 16 CPUs each)"}
  - name: coffe-flut0-ngspice-slurm
    where: slurm
    engine: udocker
    runs:
      - {name: ngspice-5p, tmax: 5p}
      - {name: ngspice-20p, tmax: 20p}
    iterations: 4
    slurm:
      root: /imec/other/sdsi/$USER/private/conexus
      container: conexus-technology-0_2_0  # udocker names: no dots or slashes
      execmode: R1
      partition: batch_long.q
      exclude: lvkclsclc010
      module: udocker
    tier_a: {cpus: 4, mem: 8G, time: "01:00:00", estimate: "about 1 minute per task, plus queue time"}
    tier_b: {cpus: 16, mem: 32G, time: "2-00:00:00", estimate: "about 3-6 h at 5 ps and 1-2 h at 20 ps per task"}
  - name: coffe-g04c-sizing-hyperion
    where: hyperion
    engine: docker
    remote: siva@hyperion
    root: /home/siva/conexus
    tiles: conexus/inputs/g04c
    smoke_tile: k5-N4-F1-C1
    tmax: 5p
    slots: 4
    iterations: 4
    max_load: 96
    tier_a: {cpus: 2, estimate: "about a minute"}
    tier_b: {cpus: 8, estimate: "about 2-4 days at 5p, about 1-1.5 days at 20p (40 tiles; estimate from flut0's simulation count; tier B of the flut0 kit replaces it)"}
